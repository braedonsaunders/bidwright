name: CI / CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Detect whether anything outside docs/README changed. Used to gate the
  # publish + deploy jobs so a README-only push doesn't rebuild images
  # or redeploy prod.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '!README.md'
              - '!docs/**'
              - '!.github/codeflow-card.svg'
              - '!.github/workflows/codeflow-card.yml'
              - '!**/*.md'
              - '!scripts/launcher/**'

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @bidwright/db db:generate

      - name: Typecheck web
        run: pnpm --filter @bidwright/web exec tsc --noEmit

      - name: Typecheck API
        run: pnpm --filter @bidwright/api exec tsc --noEmit

      - name: Typecheck worker
        run: pnpm --filter @bidwright/worker exec tsc --noEmit

      - name: Build API
        run: pnpm --filter @bidwright/api build

      - name: Build worker
        run: pnpm --filter @bidwright/worker build

      - name: Build web
        run: pnpm --filter @bidwright/web build

      - name: Run focused unit tests
        run: >
          pnpm exec tsx --test
          apps/api/src/bootstrap-key-validation.test.ts
          apps/api/src/settings-secret-crypto.test.ts
          apps/api/src/middleware/auth-route-policy.test.ts
          packages/agent/src/tenant-config.test.ts
          apps/web/lib/schedule-utils.test.ts

      - name: Validate production compose
        run: docker compose -f docker-compose.prod.yml config > /dev/null

      - name: Validate production registry compose
        run: |
          docker compose -f docker-compose.prod-registry.yml config > /dev/null
          if grep -E '^[[:space:]]+(OPENAI_API_KEY|ANTHROPIC_API_KEY|OPENROUTER_API_KEY|GOOGLE_API_KEY|GEMINI_API_KEY):' \
            docker-compose.prod.yml docker-compose.prod-registry.yml docker-compose.hosted.yml; then
            echo "::error title=Tenant credential boundary::Server compose files must not inject AI provider credentials."
            exit 1
          fi

      - name: Validate launcher compose
        run: docker compose -f scripts/launcher/docker-compose.yml config > /dev/null

      - name: Diagnose current production API image
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/braedonsaunders/bidwright-api:sha-76cf58d"
          docker pull "${IMAGE}"
          mapfile -t KEY_MATERIAL < <(node <<'NODE'
          const crypto = require("node:crypto");
          const key = crypto.randomBytes(32);
          const derived = Buffer.from(crypto.hkdfSync(
            "sha256",
            key,
            Buffer.from("bidwright-integrations-key-probe:v1"),
            Buffer.from("bidwright:settings:key-probe:v1"),
            32,
          ));
          const nonce = crypto.randomBytes(12);
          const cipher = crypto.createCipheriv("aes-256-gcm", derived, nonce);
          cipher.setAAD(Buffer.from("bidwright:integrations-encryption-key:probe:v1"));
          const ciphertext = Buffer.concat([
            cipher.update("bidwright-integrations-key-probe:v1"),
            cipher.final(),
          ]);
          console.log(key.toString("base64"));
          console.log(Buffer.concat([
            Buffer.from([1]),
            nonce,
            cipher.getAuthTag(),
            ciphertext,
          ]).toString("base64"));
          NODE
          )
          docker run --detach --name bidwright-production-api-smoke \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --publish 127.0.0.1:3001:3001 \
            --env API_PORT=3001 \
            --env BIDWRIGHT_MODE=server \
            --env BIDWRIGHT_MULTITENANT=false \
            --env DATA_DIR=/tmp/bidwright-api \
            --env "INTEGRATIONS_ENCRYPTION_KEY=${KEY_MATERIAL[0]}" \
            --env "INTEGRATIONS_ENCRYPTION_KEY_PROBE=${KEY_MATERIAL[1]}" \
            "${IMAGE}"
          trap 'docker logs bidwright-production-api-smoke; docker rm -f bidwright-production-api-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' bidwright-production-api-smoke)" != "true" ]; then
              echo "Production API image exited before becoming healthy."
              exit 1
            fi
            sleep 2
          done
          echo "Production API image did not become healthy within 60 seconds."
          exit 1

  publish:
    needs:
      - verify
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      && needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: Dockerfile.api
          - service: web
            dockerfile: Dockerfile.web
          - service: worker
            dockerfile: Dockerfile.worker
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        id: repo
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner_lc }}/bidwright-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false

  deploy:
    needs:
      - verify
      - publish
      - changes
    # Production lives on the on-prem Dokploy/Docker cluster (project
    # "bidwright" at https://cloud.rassaun.com). The deploy job runs on
    # a self-hosted, ephemeral GitHub Actions runner that lives ON the
    # Dokploy manager node (the "github-runners" Dokploy project, service
    # `bidwright-runner`). That runner sits on dokploy-network so it can
    # reach dokploy-postgres + the Dokploy API directly by service name.
    #
    # Why not ubuntu-latest + public webhook?
    #   Dokploy's deploy command is `docker compose up -d --build
    #   --remove-orphans` — it does NOT pull new `:latest` digests, so a
    #   webhook against the public URL with no env change is a no-op.
    #   We need to bump BIDWRIGHT_TAG in Dokploy's stored env (postgres
    #   `compose.env` column) so `docker compose` sees the service config
    #   changed and pulls the new sha-pinned image. The env mutation has
    #   to happen LAN-side; the runner-on-Dokploy pattern is the cleanest
    #   path that requires no public-internet-reachable Dokploy API.
    #
    # Security: PRs from forks NEVER reach this job (it's gated on
    # `push && main && ENABLE_SERVER_DEPLOY`). The runner is ephemeral
    # (fresh container per job), has no docker.sock mount, no host
    # filesystem mount, and only opens network sockets to dokploy-postgres
    # + dokploy:3000.
    runs-on: [self-hosted, linux, x64, dokploy]
    timeout-minutes: 15
    environment: production
    if: >
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        vars.ENABLE_SERVER_DEPLOY == 'true'))
      && needs.changes.outputs.code == 'true'
    concurrency:
      group: bidwright-production-deploy
      cancel-in-progress: false

    env:
      # The Dokploy compose row name (matches `compose.name` in the
      # Dokploy postgres). Distinct from `appName`; this is the
      # human-friendly identifier shown in the UI.
      COMPOSE_NAME: bidwright
      # The .env variable in that compose's stored env whose value
      # we bump to the new sha tag.
      TAG_ENV_KEY: BIDWRIGHT_TAG

    steps:
      - name: Check out production compose source
        uses: actions/checkout@v4

      - name: Install postgres-client + curl in the ephemeral runner
        run: |
          # Ephemeral runner starts fresh each job; install the two
          # binaries the deploy step needs. ~10s.
          apt-get update -q
          apt-get install -yq --no-install-recommends postgresql-client curl ca-certificates
          psql --version

      - name: Pin tag in Dokploy env + trigger redeploy
        env:
          PGPASSWORD: ${{ secrets.DOKPLOY_PG_PASSWORD }}
          REFRESH_TOKEN: ${{ secrets.DOKPLOY_REFRESH_TOKEN }}
          INTEGRATIONS_ENCRYPTION_KEY: ${{ secrets.BIDWRIGHT_INTEGRATIONS_ENCRYPTION_KEY }}
          INTEGRATIONS_ENCRYPTION_KEY_PROBE: ${{ secrets.BIDWRIGHT_INTEGRATIONS_ENCRYPTION_KEY_PROBE }}
        run: |
          set -euo pipefail
          : "${INTEGRATIONS_ENCRYPTION_KEY:?BIDWRIGHT_INTEGRATIONS_ENCRYPTION_KEY is not configured}"
          : "${INTEGRATIONS_ENCRYPTION_KEY_PROBE:?BIDWRIGHT_INTEGRATIONS_ENCRYPTION_KEY_PROBE is not configured}"
          INTEGRATIONS_ENCRYPTION_KEY="$(
            printf '%s' "${INTEGRATIONS_ENCRYPTION_KEY}" | tr -d '\r\n '
          )"
          INTEGRATIONS_ENCRYPTION_KEY_PROBE="$(
            printf '%s' "${INTEGRATIONS_ENCRYPTION_KEY_PROBE}" | tr -d '\r\n '
          )"
          export INTEGRATIONS_ENCRYPTION_KEY INTEGRATIONS_ENCRYPTION_KEY_PROBE
          # The self-hosted Dokploy runner still exposes an old system Node.
          # Keep this pre-deploy probe CommonJS-compatible and implement HKDF
          # using long-supported crypto primitives.
          node scripts/deploy/verify-integrations-key-probe.cjs
          SHORT_SHA="${GITHUB_SHA:0:7}"
          NEW_TAG="sha-${SHORT_SHA}"
          echo "Pinning ${TAG_ENV_KEY}=${NEW_TAG} on Dokploy compose '${COMPOSE_NAME}'…"
          dq() { psql -h dokploy-postgres -U dokploy -d dokploy -tAc "$1" 2>/dev/null | tr -d '[:space:]' || true; }

          # Keep Dokploy pointed at the repository's production registry
          # compose. Raw-compose installations store a snapshot in Postgres;
          # provider-backed installations clone main and use composePath.
          # Synchronizing both shapes prevents a stale mirrored compose from
          # silently omitting newly required service environment variables.
          COMPOSE_SOURCE="$(dq "SELECT \"sourceType\" FROM compose WHERE name='${COMPOSE_NAME}';")"
          COMPOSE_FILE_B64="$(base64 -w0 docker-compose.prod-registry.yml)"
          psql -h dokploy-postgres -U dokploy -d dokploy \
            -v ON_ERROR_STOP=1 \
            -v compose_file_b64="${COMPOSE_FILE_B64}" <<SQL
          UPDATE compose
          SET
            "composeType" = 'docker-compose',
            "composePath" = CASE
              WHEN "sourceType" = 'raw' THEN './docker-compose.yml'
              ELSE './docker-compose.prod-registry.yml'
            END,
            "composeFile" = CASE
              WHEN "sourceType" = 'raw'
                THEN convert_from(decode(:'compose_file_b64', 'base64'), 'UTF8')
              ELSE "composeFile"
            END
          WHERE name = '${COMPOSE_NAME}';
          SQL
          echo "Dokploy compose source synchronized (${COMPOSE_SOURCE})."

          # Update the compose's stored env (postgres is the source of truth;
          # Dokploy writes it to disk on each deploy). Bare-quotes the
          # constants to keep psql/regex sane.
          psql -h dokploy-postgres -U dokploy -d dokploy \
            -v ON_ERROR_STOP=1 \
            -v encryption_key="${INTEGRATIONS_ENCRYPTION_KEY}" \
            -v encryption_key_probe="${INTEGRATIONS_ENCRYPTION_KEY_PROBE}" <<SQL
          UPDATE compose
          SET env =
            CASE
              WHEN env ~ '(^|\n)INTEGRATIONS_ENCRYPTION_KEY='
                THEN regexp_replace(
                  env,
                  '(^|\n)INTEGRATIONS_ENCRYPTION_KEY=[^\n]*',
                  E'\\\\1INTEGRATIONS_ENCRYPTION_KEY=' || :'encryption_key'
                )
              ELSE rtrim(env, E'\n') || E'\nINTEGRATIONS_ENCRYPTION_KEY=' || :'encryption_key'
            END
          WHERE name = '${COMPOSE_NAME}';
          UPDATE compose
          SET env =
            CASE
              WHEN env ~ '(^|\n)INTEGRATIONS_ENCRYPTION_KEY_PROBE='
                THEN regexp_replace(
                  env,
                  '(^|\n)INTEGRATIONS_ENCRYPTION_KEY_PROBE=[^\n]*',
                  E'\\\\1INTEGRATIONS_ENCRYPTION_KEY_PROBE=' || :'encryption_key_probe'
                )
              ELSE rtrim(env, E'\n') || E'\nINTEGRATIONS_ENCRYPTION_KEY_PROBE=' || :'encryption_key_probe'
            END
          WHERE name = '${COMPOSE_NAME}';
          UPDATE compose
          SET env = regexp_replace(env, '${TAG_ENV_KEY}=[^\n]*', '${TAG_ENV_KEY}=${NEW_TAG}')
          WHERE name = '${COMPOSE_NAME}';
          SELECT
            (regexp_match(env, '${TAG_ENV_KEY}=([^\n]+)'))[1] AS confirmed_tag,
            CASE
              WHEN env ~ '(^|\n)INTEGRATIONS_ENCRYPTION_KEY=[^\n]+'
                THEN 'configured'
              ELSE 'missing'
            END AS encryption_key,
            CASE
              WHEN env ~ '(^|\n)INTEGRATIONS_ENCRYPTION_KEY_PROBE=[^\n]+'
                THEN 'configured'
              ELSE 'missing'
            END AS encryption_key_probe
          FROM compose WHERE name = '${COMPOSE_NAME}';
          SQL

          STORED_KEY="$(dq "SELECT (regexp_match(env, '(^|\\n)INTEGRATIONS_ENCRYPTION_KEY=([^\\n]+)'))[2] FROM compose WHERE name='${COMPOSE_NAME}';")"
          if [ "${STORED_KEY}" != "${INTEGRATIONS_ENCRYPTION_KEY}" ]; then
            echo "::error title=Encryption key mismatch::Dokploy did not store the protected Bidwright key byte-for-byte."
            exit 1
          fi
          echo "Protected integrations encryption key stored exactly."
          STORED_PROBE="$(dq "SELECT (regexp_match(env, '(^|\\n)INTEGRATIONS_ENCRYPTION_KEY_PROBE=([^\\n]+)'))[2] FROM compose WHERE name='${COMPOSE_NAME}';")"
          if [ "${STORED_PROBE}" != "${INTEGRATIONS_ENCRYPTION_KEY_PROBE}" ]; then
            echo "::error title=Encryption key probe mismatch::Dokploy did not store the protected Bidwright key probe byte-for-byte."
            exit 1
          fi
          echo "Protected integrations encryption key probe stored exactly."

          # Record the latest deployment id BEFORE triggering so we can identify
          # THIS run's deployment when polling for its outcome.
          COMPOSE_ID="$(dq "SELECT \"composeId\" FROM compose WHERE name='${COMPOSE_NAME}';")"
          PREV_DEPLOY="$(dq "SELECT \"deploymentId\" FROM deployment WHERE \"composeId\"='${COMPOSE_ID}' ORDER BY \"createdAt\" DESC LIMIT 1;")"

          echo "Triggering Dokploy redeploy…"
          # The webhook returns almost immediately and runs compose-up async, so
          # its response does NOT mean the deploy worked — verified below.
          response=$(curl -sf -X GET --max-time 300 \
            "http://dokploy:3000/api/deploy/compose/${REFRESH_TOKEN}")
          echo "Dokploy response: $response"

          # ── Verify the deploy actually applied ──────────────────────────────
          # Poll Dokploy's deployment record until THIS run's deployment reaches
          # a terminal state; fail the job on error/timeout. Without this, a stuck
          # deploy (e.g. an expired registry token → "denied" image pull) is
          # silent-green in CI while prod keeps running the previous image — which
          # is exactly how a stale prod hid for two days.
          echo "Verifying ${NEW_TAG} actually deployed…"
          DEADLINE=$(( $(date +%s) + 360 ))
          FINAL=""
          while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
            sleep 10
            ROW="$(dq "SELECT \"deploymentId\" || ':' || status FROM deployment WHERE \"composeId\"='${COMPOSE_ID}' ORDER BY \"createdAt\" DESC LIMIT 1;")"
            DEP_ID="${ROW%%:*}"; DEP_ST="${ROW##*:}"
            echo "  latest deployment: ${DEP_ST:-<none>} (${DEP_ID:-none})"
            # Only trust a deployment created by THIS trigger.
            if [ -n "${DEP_ID}" ] && [ "${DEP_ID}" != "${PREV_DEPLOY}" ]; then
              case "${DEP_ST}" in
                done)  FINAL="done";  break ;;
                error) FINAL="error"; break ;;
              esac
            fi
          done
          if [ "${FINAL}" = "done" ]; then
            echo "::notice title=Deploy verified::Bidwright deployed ${NEW_TAG} (status=done). UI: https://cloud.rassaun.com"
          elif [ "${FINAL}" = "error" ]; then
            echo "Dokploy deployment metadata:"
            psql -h dokploy-postgres -U dokploy -d dokploy \
              -c "SELECT \"deploymentId\", status, title, COALESCE(\"errorMessage\", '') AS error, \"logPath\" FROM deployment WHERE \"deploymentId\"='${DEP_ID}';"
            echo "::error title=Deploy FAILED::Dokploy compose-up errored for ${NEW_TAG} — prod is still on the previous image. Check /etc/dokploy/logs/${COMPOSE_NAME} on dokploy-mgr."
            exit 1
          else
            echo "::error title=Deploy NOT confirmed::${NEW_TAG} did not reach a terminal deploy state within 6 min — treating as failed so prod isn't silently stale."
            exit 1
          fi

          HEALTH="$(curl -fsS --max-time 30 https://bidwright.rassaun.com/proxy/health)"
          if ! printf '%s' "${HEALTH}" | grep -q '"integrationsKeyProbe":"verified"'; then
            echo "::error title=Runtime key probe failed::The deployed API did not verify the protected integrations key probe."
            exit 1
          fi
          echo "Deployed API reports a verified integrations key probe."
