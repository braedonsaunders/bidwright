name: CodeFlow Card

# Recomputes the codeflow stats card on every merge to main and on every
# closed PR. The Action commits .github/codeflow-card.svg back to the repo;
# the README references it via <img src=".github/codeflow-card.svg">.

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codeflow-card-${{ github.ref }}
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    # The card normally renders in seconds; if analysis wedges, fail fast
    # instead of burning a 6-hour runner (which is what vendored CAD bundles
    # did before the exclude patterns below existed).
    timeout-minutes: 10
    # Skip PR-close events that weren't merged (avoids running on closed-without-merge).
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Render CodeFlow Card
        uses: braedonsaunders/codeflow/card@v1
        with:
          # Single SVG that adapts to the viewer's system theme via
          # prefers-color-scheme — looks native on light and dark READMEs.
          theme: auto
          style: compact
          # Public README — show structure, not judgment.
          show-grade: false
          show-score: false
          # Flip to true to enable thermal-receipt PR comments on every merge.
          receipts: false
          # Vendored CAD editor (absorbed third-party tree + built minified
          # workers). Analyzing it hangs buildAnalysisData for hours and it
          # isn't our code — keep it out of the stats.
          exclude: |
            apps/cad-editor/**
            apps/web/public/cad-editor/**
