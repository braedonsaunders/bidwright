  '@mlightcad/mtext-renderer': '^0.13.2'
  '@mlightcad/ribbon': '^0.1.13'
  element-plus: '^2.12.0'
  glob: '^13.0.6'
  lodash-es: '4.17.21'
  three: '^0.172.0'
  vue: '^3.4.21'
  vue-i18n: '^11.4.4'
  '@mlightcad/geometry-engine': 'workspace:*'
  '@mlightcad/common': 'workspace:*'
  '@mlightcad/graphic-interface': 'workspace:*'
  '@mlightcad/emf-converter': 'workspace:*'
